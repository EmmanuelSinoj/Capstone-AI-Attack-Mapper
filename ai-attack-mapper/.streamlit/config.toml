# Shared SOC console theme. Start Streamlit from the ai-attack-mapper folder.
[theme]
base = "dark"
primaryColor = "#5CC8FF"
backgroundColor = "#090F1B"
secondaryBackgroundColor = "#17263C"
textColor = "#E8EFF8"
borderColor = "#2A3C55"
showWidgetBorder = true
baseRadius = "8px"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
