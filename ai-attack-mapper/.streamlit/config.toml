# Shared dashboard theme (dark, SIEM-style console). Streamlit reads this when started from the ai-attack-mapper folder.
[theme]
base = "dark"
primaryColor = "#38BDF8"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#131C2E"
textColor = "#E2E8F0"
borderColor = "#24314A"
showWidgetBorder = true
baseRadius = "6px"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
