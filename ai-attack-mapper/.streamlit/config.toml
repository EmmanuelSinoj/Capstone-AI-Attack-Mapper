# Shared SOC console themes. Start Streamlit from the ai-attack-mapper folder.
[theme]
base = "dark"
showWidgetBorder = true
baseRadius = "8px"
font = "sans serif"

[theme.dark]
primaryColor = "#5CC8FF"
backgroundColor = "#090F1B"
secondaryBackgroundColor = "#17263C"
textColor = "#E8EFF8"
borderColor = "#2A3C55"

[theme.dark.sidebar]
backgroundColor = "#0D1625"
secondaryBackgroundColor = "#17263C"

[theme.light]
primaryColor = "#006B9E"
backgroundColor = "#F4F7FB"
secondaryBackgroundColor = "#E9EFF7"
textColor = "#17263C"
borderColor = "#CBD5E1"

[theme.light.sidebar]
backgroundColor = "#EDF2F8"
secondaryBackgroundColor = "#FFFFFF"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
