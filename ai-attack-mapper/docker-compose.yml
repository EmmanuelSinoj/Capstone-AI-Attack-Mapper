services:
  # ---------------------------------------------------------------------
  # Ollama: hosts every local model used by the system (testbed model,
  # judge/guard model for detection, and the local classification model).
  # GPU reservation targets the NVIDIA RTX 5060 via Docker Desktop's
  # WSL2 GPU passthrough. Requires Docker Desktop >= 4.29 with the
  # "Use NVIDIA GPU" option enabled in Settings > Resources.
  # ---------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: aam-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=30m
      # Lets Ollama batch a small number of concurrent /chat requests on
      # the GPU instead of queueing them one-at-a-time. Kept conservative
      # (2, not Ollama's auto-picked 4) because llama3:8b already uses
      # ~4.7GB of the RTX 5060's 8GB VRAM budget on its own -- each extra
      # parallel slot adds its own KV cache on top of that base weight
      # cost, and we don't have headroom to guess higher without risking
      # an OOM mid-run. Raise this only after confirming with
      # `docker stats aam-ollama` / `nvidia-smi` that there's still free
      # VRAM at 2, and keep attack_generation's --parallel_attempts (see
      # garak_perf.yaml) no higher than this number -- extra client-side
      # concurrency beyond what Ollama will actually batch just piles up
      # in its request queue rather than going any faster.
      - OLLAMA_NUM_PARALLEL=2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------
  # Testbed: the deployed application under attack in the Live Attack
  # Path. A thin FastAPI wrapper around Ollama with a versioned,
  # patchable system prompt. Placeholder until Testbed & Detection
  # track work begins.
  # ---------------------------------------------------------------------
  testbed:
    build:
      context: .
      dockerfile: testbed/Dockerfile
    container_name: aam-testbed
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_healthy
    ports:
      - "${TESTBED_PORT:-8000}:8000"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - TESTBED_MODEL=${TESTBED_MODEL:-llama3:8b}
      # Judge-model detector (detection/judge.py) needs
      # an approved-access token for the gated Prompt-Guard-86M model.
      # Leave blank to run heuristics-only detection.
      - HF_TOKEN=${HF_TOKEN:-}
      # Where the judge model runs: 0 = GPU (default, unchanged), cpu = CPU. Added 2026-10-05 after the dead-judge incident
      # (round 20261005_v6-2): cpu avoids any GPU contention with Ollama and gives the same scores (max logit difference < 5e-5,
      # no decision flips). Set JUDGE_DEVICE=cpu in .env to use it. See detection/VERSION.md, "Fault fix 2026-10-05".
      - JUDGE_DEVICE=${JUDGE_DEVICE:-0}
    # GPU reservation (added 2026-09-29): the judge model
    # (detection/judge.py) now runs Prompt-Guard-86M on
    # the GPU (device=0) alongside llama3:8b, rather than on CPU. Same
    # RTX 5060 / Docker Desktop WSL2 passthrough as the ollama service
    # above. VRAM headroom is thin -- observed 6.6/8.1GB used under load
    # from llama3:8b alone -- so if this ever needs to change back, set
    # device=-1 in judge.py and remove this block; nothing else depends
    # on the testbed container having GPU access.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      # Bind-mounted (not baked into the image) so editing these during
      # development doesn't require a rebuild, and so alerts.db persists
      # on the host across container rebuilds (NFR2).
      - ./testbed/system_prompt.txt:/app/system_prompt.txt
      # app.py and prompts/ bind-mounted too (added 2026-10-05): edits to app.py take effect on restart without a rebuild (the image
      # bakes in its own copy), and the numbered system-prompt versions (prompts/, item 12) persist on the host.
      - ./testbed/app.py:/app/app.py
      - ./testbed/prompts:/app/prompts
      - ./detection:/app/detection
      - ./alert_store:/app/alert_store

  # ---------------------------------------------------------------------
  # Alert Store: SQLite is file-backed and needs no server. It has no
  # service block of its own -- it's the bind-mounted ./alert_store
  # volume above, written to by the testbed's detection layer and read
  # by whatever the Classification Engine / Evaluation components turn
  # into once those are built. alerts.db itself is gitignored; the
  # schema (schema.sql) is what's version-controlled.
  # ---------------------------------------------------------------------

  # ---------------------------------------------------------------------
  # Dashboard: read-only "ops console" web UI over alerts.db + Ollama +
  # testbed, so a garak/PyRIT run can be watched from a browser instead
  # of three terminal windows. See dashboard/README.md.
  # Everything it reads is bind-mounted `:ro` -- this service cannot
  # write to alerts.db or call /chat, and doesn't need GPU access itself.
  # depends_on testbed only (not `condition: service_healthy`) since the
  # dashboard is still useful -- shows services as red/offline -- even
  # before the rest of the stack is up.
  # ---------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: aam-dashboard
    restart: unless-stopped
    depends_on:
      - testbed
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - TESTBED_HOST=http://testbed:8000
    volumes:
      - ./alert_store:/app/alert_store:ro
      - ./attack_generation/reports:/app/reports:ro

volumes:
  ollama_data:
    name: aam_ollama_data
